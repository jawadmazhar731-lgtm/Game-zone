<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tower Climb 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#1a0533 0%,#3b0f5c 55%,#12041f 100%);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; text-align:center; padding-top:16px; pointer-events:none; z-index:5; }
  #score { font-size:54px; font-weight:900; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.55); line-height:1; }
  #best { font-size:12px; letter-spacing:3px; color:rgba(255,255,255,.65); margin-top:4px; }
  #previewTag {
    position:fixed; top:12px; left:12px; z-index:7; pointer-events:none;
    font-size:10px; letter-spacing:2px; color:#ffd9d4;
    background:rgba(0,0,0,.45); padding:6px 10px; border-radius:20px;
    border:1px solid rgba(255,34,17,.5);
  }
  #hint {
    position:fixed; bottom:40px; left:0; right:0; z-index:5; pointer-events:none;
    display:flex; justify-content:space-between; padding:0 34px;
    font-size:15px; font-weight:800; letter-spacing:2px; color:rgba(255,255,255,.55);
  }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:6; pointer-events:none; }
  #overlay .card { text-align:center; color:#fff; animation:pulse 1.6s ease-in-out infinite; padding:0 20px; }
  #overlay h1 { font-size:32px; font-weight:900; letter-spacing:2px; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  #overlay p { margin-top:10px; font-size:14px; color:rgba(255,255,255,.78); letter-spacing:1px; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.92} 50%{transform:scale(1.05);opacity:1} }
</style>
</head>
<body>
<div id="previewTag">★ PREVIEW — Game Zone demo</div>
<div id="hud"><div id="score">0</div><div id="best">BEST 0</div></div>
<div id="hint"><span>◀ LEFT</span><span>RIGHT ▶</span></div>
<div id="overlay"><div class="card" id="overlayCard"><h1>TAP TO START</h1><p>Tap LEFT or RIGHT to climb to the next block!</p></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const BLOCK_W = 1.9, BLOCK_H = 1.0, BLOCK_D = 1.9, STEP_Y = 1.15, SIDE_X = 1.35;
let scene, camera, renderer, climber;
let blocks = [];
let state = 'ready'; // ready | playing | hopping | falling | over
let score = 0, best = parseInt(localStorage.getItem('climb3d_best') || '0', 10);
let hopT = 0, hopFrom = new THREE.Vector3(), hopTo = new THREE.Vector3(), hopPeak = 0;
let fallV = 0, camY = 0, audioCtx = null;
const clock = new THREE.Clock();

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const card = document.getElementById('overlayCard');
bestEl.textContent = 'BEST ' + best;

init();

function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a0533, 14, 30);
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3.2, 8.5);
  camera.lookAt(0, 1.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x552277, 1.0));
  const dl = new THREE.DirectionalLight(0xffffff, 1.3);
  dl.position.set(5, 10, 6);
  scene.add(dl);
  const pl = new THREE.PointLight(0xff6ad5, 12, 20);
  pl.position.set(0, 4, 3);
  scene.add(pl);

  // climber: boxy character
  climber = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffb300, roughness: 0.5 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.4), bodyMat);
  body.position.y = 0.55;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xffe0b2, roughness: 0.5 }));
  head.position.y = 1.1;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
  for (const ex of [-0.11, 0.11]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.02), eyeMat);
    eye.position.set(ex, 1.12, 0.22);
    climber.add(eye);
  }
  climber.add(body, head);
  scene.add(climber);

  reset();
  animate();

  window.addEventListener('pointerdown', onTap);
  window.addEventListener('resize', onResize);
}

function blockColor(i) {
  const c = new THREE.Color();
  c.setHSL((0.78 + i * 0.045) % 1, 0.5, 0.42 + (i % 2) * 0.08);
  return c;
}

function addBlock(i, side) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(BLOCK_W, BLOCK_H, BLOCK_D),
    new THREE.MeshStandardMaterial({ color: blockColor(i), roughness: 0.65 })
  );
  m.position.set(side * SIDE_X, i * STEP_Y, 0);
  // small grass cap like the reference
  const cap = new THREE.Mesh(
    new THREE.BoxGeometry(BLOCK_W + 0.06, 0.12, BLOCK_D + 0.06),
    new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.7 })
  );
  cap.position.y = BLOCK_H / 2 + 0.05;
  m.add(cap);
  scene.add(m);
  blocks.push({ mesh: m, side: side, y: i * STEP_Y });
}

function reset() {
  for (const b of blocks) scene.remove(b.mesh);
  blocks = [];
  score = 0;
  scoreEl.textContent = '0';
  let side = 0;
  addBlock(0, 0);
  for (let i = 1; i < 8; i++) {
    side = Math.random() < 0.5 ? -1 : 1;
    if (Math.random() < 0.25) side = -side; // occasional same-side repeat
    addBlock(i, side);
  }
  const b0 = blocks[0];
  climber.position.set(b0.mesh.position.x, b0.y + BLOCK_H / 2, 0);
  climber.rotation.set(0, 0, 0);
  camY = 1.5;
}

function startGame() {
  reset();
  state = 'playing';
  overlay.style.display = 'none';
}

function gameOver(fell) {
  state = 'over';
  if (score > best) { best = score; localStorage.setItem('climb3d_best', String(best)); }
  bestEl.textContent = 'BEST ' + best;
  card.innerHTML = '<h1>GAME OVER</h1><p>Height: ' + score + ' &nbsp;•&nbsp; Best: ' + best + '<br>TAP TO RETRY</p>';
  overlay.style.display = 'flex';
  if (!fell) beep(160, 0.35, 'sawtooth');
}

function onTap(e) {
  ensureAudio();
  if (state === 'ready' || state === 'over') { startGame(); return; }
  if (state !== 'playing') return;
  const tapLeft = e.clientX < window.innerWidth / 2;
  const wantSide = tapLeft ? -1 : 1;
  const cur = blocks[0], nxt = blocks[1];
  hopFrom.copy(climber.position);
  if (nxt && nxt.side === wantSide) {
    hopTo.set(nxt.mesh.position.x, nxt.y + BLOCK_H / 2, 0);
    hopPeak = 1.1;
    beep(440, 0.1, 'square');
  } else {
    // wrong side — hop into the air and fall
    hopTo.set(hopFrom.x + wantSide * 1.6, hopFrom.y + 0.6, 0);
    hopPeak = 0.8;
    state = 'falling';
    fallV = 0;
    beep(220, 0.2, 'sawtooth');
  }
  hopT = 0;
  if (state === 'playing') state = 'hopping';
}

function update(dt) {
  if (state === 'hopping' || state === 'falling') {
    hopT += dt / 0.32;
    const t = Math.min(1, hopT);
    climber.position.lerpVectors(hopFrom, hopTo, t);
    climber.position.y += Math.sin(t * Math.PI) * hopPeak;
    climber.rotation.z = (hopTo.x - hopFrom.x) * -0.25 * Math.sin(t * Math.PI);
    if (t >= 1) {
      if (state === 'hopping') {
        const old = blocks.shift();
        scene.remove(old.mesh);
        score++;
        scoreEl.textContent = String(score);
        beep(620, 0.1, 'sine');
        // extend tower upward
        const top = blocks[blocks.length - 1];
        let side = Math.random() < 0.5 ? -1 : 1;
        addBlock(blocks.length, side);
        // prune far-below blocks (keep current at index 0)
        while (blocks.length > 9) {
          const rm = blocks.splice(1, 1)[0];
          scene.remove(rm.mesh);
        }
        state = 'playing';
        climber.rotation.z = 0;
      } else {
        state = 'falling2';
      }
    }
  } else if (state === 'falling2') {
    fallV += 22 * dt;
    climber.position.y -= fallV * dt;
    climber.rotation.z += dt * 6;
    if (climber.position.y < -6) gameOver(true);
  }
  // camera follows climber height
  const targetY = climber.position.y + 1.2;
  camY += (targetY - camY) * Math.min(1, dt * 5);
  camera.position.y = camY + 1.8;
  camera.lookAt(0, camY, 0);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, dur, type) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
</script>
</body>
</html>
